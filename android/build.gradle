// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'

        // NOTE: Capacitor's template also puts `com.google.gms:google-services`
        // on this classpath for Firebase push notifications. It is removed
        // deliberately - this app has no push notifications, and the plugin is
        // proprietary, which F-Droid's scanner flags as a non-free dependency.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
