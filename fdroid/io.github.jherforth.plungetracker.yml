# F-Droid build recipe for Plunge Tracker.
#
# This file does NOT belong to this repository's build. It is kept here for
# reference and review; to publish, copy it to
#   metadata/io.github.jherforth.plungetracker.yml
# in a fork of https://gitlab.com/fdroid/fdroiddata and open a merge request.
#
# Before submitting, tag the release so `commit:` below resolves:
#   git tag -s v1.0.0 -m "Plunge Tracker 1.0.0" && git push origin v1.0.0

Categories:
  - Sports & Health
License: MIT
AuthorName: Jason Herforth
SourceCode: https://github.com/jherforth/Plunge-Tracker
IssueTracker: https://github.com/jherforth/Plunge-Tracker/issues

AutoName: Plunge Tracker

RepoType: git
Repo: https://github.com/jherforth/Plunge-Tracker.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      # The buildserver's packaged Node is far too old for Vite 6, so install a
      # pinned Node LTS and verify it against the published checksum.
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
      - echo "83bf07dd343002a26211cf1fcd46a9d9534219aad42ee02847816940bf610a72  /tmp/node.tar.xz" | sha256sum -c -
      - tar xJf /tmp/node.tar.xz -C /opt
      - ln -sf /opt/node-v22.11.0-linux-x64/bin/node /usr/local/bin/node
      - ln -sf /opt/node-v22.11.0-linux-x64/bin/npm /usr/local/bin/npm
      - ln -sf /opt/node-v22.11.0-linux-x64/bin/npx /usr/local/bin/npx
    init:
      # `npm ci` installs strictly from package-lock.json, so the dependency
      # tree is reproducible from what is committed to the repository.
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
