    versionCode: 1
    commit: 5455c926e6a17102c54c79e3b6dc94f1eac32aed
    subdir: android/app
    sudo:
      - cd /etc/apt
      - echo deb https://deb.debian.org/debian forky main >>sources.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - node_modules/esbuild
      - node_modules/@esbuild
      - node_modules/@capacitor/cli

